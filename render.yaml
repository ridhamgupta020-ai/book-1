services:
  - type: web
    name: mybookshow-web
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn bookmyseat.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SUPABASE_URL
        value: "https://iqxcgzrfjplernbidkfd.supabase.co"
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
