# ==============================================================================
# Render Blueprint Specification for MyBookShow (Django 5.1 + Supabase Postgres)
# ==============================================================================
# Specifically structured to eliminate `ModuleNotFoundError` on Render by:
# 1. Explicitly binding Gunicorn to `bookmyseat.wsgi:application` (instead of
#    Render's default manual `gunicorn app:app` command).
# 2. Enforcing `PYTHONPATH=.` and `DJANGO_SETTINGS_MODULE=bookmyseat.settings`
#    so Python always resolves project packages from `/opt/render/project/src`.
# 3. Pinning `PYTHON_VERSION=3.12.6` to ensure prebuilt binary wheel support
#    for `psycopg2-binary` and `Pillow`.
# ==============================================================================

services:
  - type: web
    name: mybookshow-web
    runtime: python
    region: singapore
    plan: free
    branch: main
    rootDir: .
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn bookmyseat.wsgi:application --config gunicorn.conf.py --bind 0.0.0.0:${PORT:-10000}"
    healthCheckPath: "/"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PYTHONPATH
        value: "."
      - key: DJANGO_SETTINGS_MODULE
        value: "bookmyseat.settings"
      - key: WEB_CONCURRENCY
        value: "3"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Supply your Supabase IPv4 Session Pooler URI in Render Dashboard
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SUPABASE_URL
        value: "https://iqxcgzrfjplernbidkfd.supabase.co"
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Configure these with the Firebase web app settings for the same project
      # that owns the Google provider and service-account credentials.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_ADMIN_CREDENTIALS
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
