{% extends "base.html" %}
{% block title %}Reset Password — MyBookShow{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 480px;">
  <div class="card bg-cinema-surface border-secondary border-opacity-25 p-4">
    <h1 class="h4 fw-bold font-display mb-3">Reset Your Password</h1>
    <p class="text-secondary small mb-3">Enter your registered email address to receive password reset instructions.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">Send Reset Link</button>
    </form>
  </div>
</div>
{% endblock %}
