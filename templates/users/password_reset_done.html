{% extends "base.html" %}
{% block title %}Password Reset Sent — MyBookShow{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 480px;">
  <div class="card bg-cinema-surface border-secondary border-opacity-25 p-4 text-center">
    <h1 class="h4 fw-bold font-display mb-2">Check Your Email</h1>
    <p class="text-secondary small mb-4">If an account exists for the email provided, password reset instructions have been dispatched.</p>
    <a href="{% url 'users:login' %}" class="btn btn-outline-light btn-sm px-4">Return to Sign In</a>
  </div>
</div>
{% endblock %}
