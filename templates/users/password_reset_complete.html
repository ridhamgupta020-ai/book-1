{% extends "base.html" %}
{% block title %}Password Updated — MyBookShow{% endblock %}
{% block content %}
<div class="container auth-page py-5">
  <section class="card auth-card bg-cinema-surface border-secondary border-opacity-25 p-4 p-sm-5 text-center" aria-labelledby="reset-complete-title">
    <h1 id="reset-complete-title" class="h4 fw-bold font-display mb-3">Password Updated</h1>
    <p class="text-secondary">Your password has been changed. You can now sign in with your new password.</p>
    <a href="{% url 'users:login' %}" class="btn btn-danger w-100 py-2 fw-semibold">Return to Sign In</a>
  </section>
</div>
{% endblock %}
