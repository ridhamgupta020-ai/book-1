{% extends "base.html" %}
{% block title %}Create Account — MyBookShow{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 520px;">
  <div class="card bg-cinema-surface border-secondary border-opacity-25 p-4">
    <h1 class="h3 fw-bold font-display mb-3">Create Your Account</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">Register</button>
    </form>
  </div>
</div>
{% endblock %}
