{% extends "base.html" %}
{% load static %}
{% block title %}Sign In — MyBookShow{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 460px;">
  <div class="card bg-cinema-surface border-secondary border-opacity-25 p-4">
    <h1 class="h3 fw-bold font-display mb-3">Sign In</h1>
    <form id="login-form" method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next|default:'' }}" />
      {{ form.as_p }}
      <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">Sign In</button>
    </form>
    <div class="my-3 d-flex align-items-center gap-3 text-secondary small">
      <span class="border-top border-secondary flex-grow-1"></span>
      <span>or</span>
      <span class="border-top border-secondary flex-grow-1"></span>
    </div>
    <button
      id="google-sign-in"
      class="btn btn-outline-light w-100 py-2"
      type="button"
      data-session-url="{% url 'users:google_session' %}"
      aria-describedby="google-sign-in-message"
    >
      <span id="google-sign-in-label">Continue with Google</span>
    </button>
    <p id="google-sign-in-message" class="small text-danger mt-3 mb-0" role="alert" aria-live="polite"></p>
    <div class="mt-3 small text-secondary d-flex justify-content-between">
      <a href="{% url 'users:register' %}" class="text-danger text-decoration-none">Create Account</a>
      <a href="{% url 'users:password_reset' %}" class="text-secondary text-decoration-none">Forgot Password?</a>
    </div>
  </div>
</div>
{{ firebase_web_config|json_script:"firebase-web-config" }}
<script type="module" src="{% static 'js/firebase-auth.js' %}"></script>
{% endblock %}
