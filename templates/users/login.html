{% extends "base.html" %}
{% block title %}Sign In — MyBookShow{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 460px;">
  <div class="card bg-cinema-surface border-secondary border-opacity-25 p-4">
    <h1 class="h3 fw-bold font-display mb-3">Sign In</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">Sign In</button>
    </form>
    <div class="mt-3 small text-secondary d-flex justify-content-between">
      <a href="{% url 'users:register' %}" class="text-danger text-decoration-none">Create Account</a>
      <a href="{% url 'users:password_reset' %}" class="text-secondary text-decoration-none">Forgot Password?</a>
    </div>
  </div>
</div>
{% endblock %}
